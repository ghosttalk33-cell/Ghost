<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Crawler</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #262a36; --text: #e6e8ee; --muted: #8b90a0;
    --accent: #8b7bff; --ok: #3ecf8e; --warn: #f5a524; --err: #f2555a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; }
  header span { color: var(--muted); }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text], input[type=number] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #url { flex: 1; min-width: 240px; font-size: 15px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 500; }
  button:disabled { opacity: .45; cursor: default; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  .opts label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  .opts label.check { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat small { color: var(--muted); }
  .progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 14px 0 0; }
  .progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input { flex: 1; min-width: 180px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; white-space: nowrap; }
  tr.item:hover { background: #1d2130; cursor: pointer; }
  td.url { max-width: 420px; word-break: break-all; }
  td.url a { color: var(--text); text-decoration: none; }
  td.title { max-width: 320px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .s2 { background: #3ecf8e22; color: var(--ok); }
  .s3 { background: #8b7bff22; color: var(--accent); }
  .s4, .s0 { background: #f2555a22; color: var(--err); }
  .s5 { background: #f5a52422; color: var(--warn); }
  .muted { color: var(--muted); }
  tr.detail td { background: #13161e; }
  .detail-grid { display: grid; gap: 6px; font-size: 13px; }
  .detail-grid ul { margin: 4px 0 0; padding-left: 18px; max-height: 160px; overflow: auto; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  @media (max-width: 600px) { main, header { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>👻 Ghost Crawler</h1>
  <span>Crawl een website en bekijk alle pagina's, titels, links en fouten</span>
</header>

<main>
  <form class="card" id="form">
    <div class="row">
      <input type="text" id="url" placeholder="https://voorbeeld.nl" required autofocus>
      <button type="submit" id="startBtn">Start crawl</button>
      <button type="button" id="stopBtn" class="secondary" disabled>Stop</button>
    </div>
    <details>
      <summary>Instellingen</summary>
      <div class="opts">
        <label>Max. pagina's<input type="number" id="maxPages" value="50" min="1" max="2000"></label>
        <label>Max. diepte<input type="number" id="maxDepth" value="3" min="0" max="20"></label>
        <label>Gelijktijdige verzoeken<input type="number" id="concurrency" value="3" min="1" max="10"></label>
        <label>Pauze tussen verzoeken (ms)<input type="number" id="delay" value="200" min="0"></label>
        <label>Alleen URL's met (regex)<input type="text" id="include" placeholder="bijv. /blog/"></label>
        <label>URL's uitsluiten (regex)<input type="text" id="exclude" placeholder="bijv. \?page=|/tag/"></label>
        <label class="check"><input type="checkbox" id="sameHost" checked> Alleen hetzelfde domein</label>
        <label class="check"><input type="checkbox" id="respectRobots" checked> robots.txt respecteren</label>
      </div>
    </details>
    <div class="progress"><div id="bar"></div></div>
  </form>

  <div class="stats" style="margin-bottom:16px">
    <div class="stat"><b id="stPages">0</b><small>Pagina's gecrawld</small></div>
    <div class="stat"><b id="stOk" style="color:var(--ok)">0</b><small>OK (2xx)</small></div>
    <div class="stat"><b id="stErr" style="color:var(--err)">0</b><small>Fouten (4xx/5xx/netwerk)</small></div>
    <div class="stat"><b id="stQueue">0</b><small>In wachtrij</small></div>
    <div class="stat"><b id="stEmails">0</b><small>E-mailadressen</small></div>
    <div class="stat"><b id="stTime">0 ms</b><small>Gem. laadtijd</small></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input type="text" id="filter" placeholder="Filter op URL of titel…">
      <button type="button" class="secondary" id="csvBtn">⬇ CSV</button>
      <button type="button" class="secondary" id="jsonBtn">⬇ JSON</button>
      <button type="button" class="secondary" id="emailBtn">⬇ E-mails</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-k="status">Status</th>
            <th data-k="url">URL</th>
            <th data-k="title">Titel</th>
            <th data-k="depth">Diepte</th>
            <th data-k="linkCount">Links</th>
            <th data-k="wordCount">Woorden</th>
            <th data-k="timeMs">Tijd</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">Voer een URL in en klik op <b>Start crawl</b>.</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let results = [];
let source = null;
let sortKey = null, sortDir = 1;
let openUrl = null;
let maxPages = 50;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function statusBadge(s) {
  const cls = 's' + String(s || 0)[0];
  return `<span class="badge ${cls}">${s || 'ERR'}</span>`;
}

function render() {
  const q = $('filter').value.toLowerCase();
  let list = results.filter(r => !q || r.url.toLowerCase().includes(q) || (r.title || '').toLowerCase().includes(q));
  if (sortKey) {
    list = [...list].sort((a, b) => {
      const x = a[sortKey] ?? '', y = b[sortKey] ?? '';
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir;
    });
  }
  if (!list.length) {
    $('rows').innerHTML = `<tr><td colspan="7" class="empty">${results.length ? 'Geen resultaten voor dit filter.' : 'Nog geen resultaten.'}</td></tr>`;
    return;
  }
  $('rows').innerHTML = list.map(r => {
    let html = `<tr class="item" data-url="${esc(r.url)}">
      <td>${statusBadge(r.status)}</td>
      <td class="url"><a href="${esc(r.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(r.url)}</a></td>
      <td class="title">${esc(r.title) || `<span class="muted">${esc(r.error || '—')}</span>`}</td>
      <td>${r.depth}</td>
      <td>${r.linkCount ?? '—'}</td>
      <td>${r.wordCount ?? '—'}</td>
      <td>${r.timeMs} ms</td>
    </tr>`;
    if (openUrl === r.url) {
      html += `<tr class="detail"><td colspan="7"><div class="detail-grid">
        ${r.finalUrl && r.finalUrl !== r.url ? `<div><b>Doorgestuurd naar:</b> ${esc(r.finalUrl)}</div>` : ''}
        <div><b>Gevonden via:</b> ${r.from ? esc(r.from) : '<span class="muted">startpagina</span>'}</div>
        <div><b>Content-Type:</b> ${esc(r.contentType || '—')} · <b>Grootte:</b> ${r.size ? (r.size / 1024).toFixed(1) + ' KB' : '—'}</div>
        <div><b>Meta description:</b> ${esc(r.description) || '<span class="muted">ontbreekt</span>'}</div>
        <div><b>H1:</b> ${r.h1?.length ? esc(r.h1.join(' | ')) : '<span class="muted">ontbreekt</span>'}</div>
        <div><b>Afbeeldingen:</b> ${r.imageCount ?? 0}</div>
        ${r.emails?.length ? `<div><b>E-mailadressen:</b><ul>${r.emails.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
        ${r.error ? `<div style="color:var(--err)"><b>Fout:</b> ${esc(r.error)}</div>` : ''}
      </div></td></tr>`;
    }
    return html;
  }).join('');
}

function updateStats(queued = 0) {
  const ok = results.filter(r => r.status >= 200 && r.status < 300).length;
  const err = results.filter(r => !r.status || r.status >= 400).length;
  const emails = new Set(results.flatMap(r => r.emails || []));
  const avg = results.length ? Math.round(results.reduce((s, r) => s + r.timeMs, 0) / results.length) : 0;
  $('stPages').textContent = results.length;
  $('stOk').textContent = ok;
  $('stErr').textContent = err;
  $('stQueue').textContent = queued;
  $('stEmails').textContent = emails.size;
  $('stTime').textContent = avg + ' ms';
  $('bar').style.width = Math.min(100, results.length / maxPages * 100) + '%';
}

function setRunning(on) {
  $('startBtn').disabled = on;
  $('stopBtn').disabled = !on;
  $('startBtn').textContent = on ? 'Bezig met crawlen…' : 'Start crawl';
}

function stop() {
  if (source) { source.close(); source = null; }
  setRunning(false);
}

let renderPending = false;
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; render(); });
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  stop();
  results = []; openUrl = null;
  maxPages = +$('maxPages').value || 50;
  updateStats(); render();
  const p = new URLSearchParams({
    url: $('url').value.trim(),
    maxPages, maxDepth: $('maxDepth').value, concurrency: $('concurrency').value, delay: $('delay').value,
    include: $('include').value, exclude: $('exclude').value,
    sameHost: $('sameHost').checked, respectRobots: $('respectRobots').checked,
  });
  setRunning(true);
  source = new EventSource('/api/crawl?' + p);
  source.addEventListener('page', ev => {
    const d = JSON.parse(ev.data);
    results.push(d);
    updateStats(d.queued);
    scheduleRender();
  });
  source.addEventListener('done', ev => {
    const d = JSON.parse(ev.data);
    updateStats(d.remaining);
    $('bar').style.width = '100%';
    stop();
  });
  source.addEventListener('failure', ev => { alert('Fout: ' + JSON.parse(ev.data).error); stop(); });
  source.onerror = () => {
    if (source && !results.length) alert('Kon de crawl niet starten. Controleer de URL en of de server draait.');
    stop();
  };
});

$('stopBtn').addEventListener('click', stop);
$('filter').addEventListener('input', render);
$('rows').addEventListener('click', e => {
  const tr = e.target.closest('tr.item');
  if (!tr) return;
  openUrl = openUrl === tr.dataset.url ? null : tr.dataset.url;
  render();
});
document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : 1;
  sortKey = k;
  render();
}));

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');

$('csvBtn').addEventListener('click', () => {
  const cols = ['status', 'url', 'finalUrl', 'title', 'description', 'h1', 'depth', 'linkCount', 'imageCount', 'wordCount', 'timeMs', 'from', 'error'];
  const cell = v => '"' + String(Array.isArray(v) ? v.join(' | ') : v ?? '').replace(/"/g, '""') + '"';
  const csv = [cols.join(','), ...results.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
  download(`crawl-${stamp()}.csv`, '﻿' + csv, 'text/csv');
});
$('jsonBtn').addEventListener('click', () => download(`crawl-${stamp()}.json`, JSON.stringify(results, null, 2), 'application/json'));
$('emailBtn').addEventListener('click', () => {
  const emails = [...new Set(results.flatMap(r => r.emails || []))].sort();
  download(`emails-${stamp()}.txt`, emails.join('\n'), 'text/plain');
});
</script>
</body>
</html>
